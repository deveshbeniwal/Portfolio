<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Glow & Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Inner Soft Inset -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Gamepad Body -->
  <g filter="url(#shadow)">
    <!-- Controller Body -->
    <path d="M16 26 C13 26 10 32 11 41 C11.5 45.5 15.5 47 18 45 L24 39 L40 39 L46 45 C48.5 47 52.5 45.5 53 41 C54 32 51 26 48 26 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- D-Pad (Left) -->
    <rect x="18" y="31" width="3" height="7" rx="1" fill="#0284c7"/>
    <rect x="16" y="33" width="7" height="3" rx="1" fill="#0284c7"/>
    <circle cx="19.5" cy="34.5" r="0.8" fill="#bae6fd"/>

    <!-- Action Buttons (Right) -->
    <circle cx="43" cy="32" r="1.5" fill="#ef4444"/>
    <circle cx="46" cy="35" r="1.5" fill="#3b82f6"/>
    <circle cx="40" cy="35" r="1.5" fill="#10b981"/>
    <circle cx="43" cy="38" r="1.5" fill="#f59e0b"/>

    <!-- Center Unity 'U' / Star Accent -->
    <polygon points="32,23 33.8,27.5 38.5,27.5 34.7,30.3 36.1,34.8 32,32 27.9,34.8 29.3,30.3 25.5,27.5 30.2,27.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
  </g>
</svg>
